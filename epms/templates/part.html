{% extends "base.html" %}
{% block content %}
<h1>{{ part.name }}</h1>
<p>Qtt: {{ part.quantity }}</p>
<p>
    Change qtt: 
    <form method="POST" action="/change_qtt">
        <input type="number" name="new_qtt">
        <input hidden name="part_id" type="number" value="{{ part.id }}">
        <button type="submit">C</button>
    </form>

    <h2>Upload datasheet</h2>
        <form enctype="multipart/form-data" method="POST" action="{{ url_for('main.upload_datasheet', part_id = part.id) }}">
            <input type="file" name="part_datasheet" accept=".pdf">
            <input type="submit">
        </form>
<p>Documentation: {{ part.doc_link }}</p>
<h2>Part data extracted</h2>
{{ part_data }}
{% endblock %}
